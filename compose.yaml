name: pulse

x-node: &node
  image: ${PULSE_BACKEND_IMAGE:-pulse-backend:local}
  build:
    context: .
    dockerfile: deploy/backend.Dockerfile
  restart: unless-stopped
  init: true
  mem_limit: 256m
  environment: &node-env
    NODE_ENV: production
    NODE_OPTIONS: --max-old-space-size=160
    CLIENT_URL: ${CLIENT_URL:?Set CLIENT_URL}
    ADMIN_URL: ${ADMIN_URL:?Set ADMIN_URL}
    CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?Set CLERK_PUBLISHABLE_KEY}
    CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set CLERK_SECRET_KEY}
    REDIS_URL: redis://redis:6379
  logging: &logs
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: pulse
      POSTGRES_DB: pulse_products
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=40]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/01-pulse.sh:ro
      - ./deploy/postgres/schema:/pulse-schema:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U pulse -d pulse_products"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logs

  mongo:
    image: mongo:7
    restart: unless-stopped
    mem_limit: 512m
    environment:
      MONGO_INITDB_ROOT_USERNAME: pulse
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD}
    command: [mongod, --wiredTigerCacheSizeGB, "0.256", --bind_ip_all]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - 'mongosh --quiet --eval "db.adminCommand({ping:1}).ok" --username pulse --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin'
      interval: 10s
      timeout: 10s
      retries: 20
    logging: *logs

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 128m
    # Paid order events must survive a Redis restart; never evict stream entries.
    command:
      [
        redis-server,
        --appendonly,
        "yes",
        --appendfsync,
        always,
        --maxmemory,
        64mb,
        --maxmemory-policy,
        noeviction,
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logs

  payment-migrate:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./packages/payment-db/prisma/stripe-checkout.sql:/stripe-checkout.sql:ro
    command:
      [
        psql,
        -v,
        ON_ERROR_STOP=1,
        -h,
        postgres,
        -U,
        pulse,
        -d,
        pulse_payments,
        -f,
        /stripe-checkout.sql,
      ]
    logging: *logs

  product-service:
    <<: *node
    working_dir: /app/apps/product-service
    environment:
      <<: *node-env
      DATABASE_URL: postgresql://pulse:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/pulse_products?connection_limit=5
      ORDER_SERVICE_URL: http://order-service:8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  order-service:
    <<: *node
    working_dir: /app/apps/order-service
    environment:
      <<: *node-env
      MONGO_URL: mongodb://pulse:${MONGO_PASSWORD:?Set MONGO_PASSWORD}@mongo:27017/pulse_orders?authSource=admin
      PRODUCT_SERVICE_URL: http://product-service:8000
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  payment-service:
    <<: *node
    environment:
      <<: *node-env
      DATABASE_URL: postgresql://pulse:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/pulse_products?connection_limit=5
      PAYMENT_DATABASE_URL: postgresql://pulse:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/pulse_payments?connection_limit=5
      STRIPE_API_KEY: ${STRIPE_API_KEY:?Set a restricted Stripe test API key}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?Set STRIPE_WEBHOOK_SECRET}
      STRIPE_PAYMENT_METHOD_CONFIGURATION_ID: ${STRIPE_PAYMENT_METHOD_CONFIGURATION_ID:-}
    depends_on:
      payment-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  auth-service:
    <<: *node
    working_dir: /app/apps/auth-service
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 64m
    environment:
      BACKEND_HOST: ${BACKEND_HOST:?Set the backend hostname}
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - product-service
      - order-service
      - payment-service
      - auth-service
    logging: *logs

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  caddy_data:
  caddy_config:
